<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic Data Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <h1>Generate Synthetic Dataset</h1>
        <form method="post" action="/generate">
            <div class="bento">
                <div>
                    <label for="rows">Rows</label>
                    <input type="number" id="rows" name="rows" value="200" min="1" />
                </div>
                <div>
                    <label for="filename">Output File</label>
                    <input type="text" id="filename" name="filename" value="dataset.csv" />
                </div>
            </div>
            <button type="submit" id="generateBtn">Generate</button>
            <div id="spinner">Generating...</div>
        </form>
    </div>
    <script>
        const form = document.querySelector('form');
        const btn = document.getElementById('generateBtn');
        const spinner = document.getElementById('spinner');
        form.addEventListener('submit', () => {
            btn.disabled = true;
            spinner.style.display = 'block';
        });
    </script>
</body>
</html>
